<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SameWindow</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111;
      }

      #screen {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      #agent-cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 26px;
        height: 30px;
        z-index: 2147483647;
        pointer-events: none;
        filter:
          drop-shadow(0 0 3px rgb(51 156 255 / 95%))
          drop-shadow(0 0 9px rgb(51 156 255 / 58%));
        transform-origin: 4px 4px;
        will-change: transform;
      }

      #agent-click-ring {
        position: fixed;
        top: 0;
        left: 0;
        width: 22px;
        height: 22px;
        z-index: 2147483646;
        border: 2px solid rgb(51 156 255 / 88%);
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
      }

      #watch-toggle {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 2147483647;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 0 13px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 999px;
        background: rgb(11 15 19 / 78%);
        color: #edf7fb;
        box-shadow: 0 8px 28px rgb(0 0 0 / 28%);
        backdrop-filter: blur(14px);
        cursor: pointer;
        font: 600 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
      }

      #watch-toggle:hover {
        transform: translateY(-1px);
        border-color: rgb(91 203 218 / 55%);
      }

      #watch-toggle[data-state="on"] {
        border-color: rgb(91 203 218 / 70%);
        background: rgb(13 48 54 / 88%);
      }

      #watch-toggle[data-state="busy"] {
        opacity: 0.72;
        cursor: wait;
      }

      #watch-toggle[data-state="error"] {
        border-color: rgb(255 149 125 / 62%);
      }

      #watch-toggle svg {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }

      #watch-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #657078;
      }

      #watch-toggle[data-state="on"] #watch-dot {
        background: #69d8df;
        box-shadow: 0 0 0 4px rgb(105 216 223 / 14%), 0 0 12px rgb(105 216 223 / 78%);
      }
    </style>
  </head>
  <body>
    <iframe
      id="screen"
      title="SameWindow shared desktop"
      src="/vnc.html?autoconnect=1&amp;resize=scale&amp;reconnect=1&amp;samewindowSmooth=1"
    ></iframe>

    <div id="agent-cursor" aria-hidden="true">
      <svg width="26" height="30" viewBox="0 0 26 30">
        <path
          d="M2.8 2.3 L3.3 23.8 L9.1 18.3 L14.2 28.0 L18.7 25.6 L13.8 16.2 L23.1 15.9 Z"
          fill="#0b0d10"
          stroke="#f6fbff"
          stroke-width="1.35"
          stroke-linejoin="round"
        />
      </svg>
    </div>
    <div id="agent-click-ring" aria-hidden="true"></div>

    <button
      id="watch-toggle"
      type="button"
      data-state="busy"
      title="When enabled, your agent receives the title and page content after 5 seconds, then fuller visible text including comments after 15 seconds. Raw pointer trails are not stored."
      aria-pressed="false"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M3.5 12h17M12 3c2.3 2.5 3.5 5.5 3.5 9S14.3 18.5 12 21M12 3C9.7 5.5 8.5 8.5 8.5 12S9.7 18.5 12 21" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" />
      </svg>
      <span id="watch-label">Browse together</span>
      <span id="watch-dot" aria-hidden="true"></span>
    </button>

    <script src="/agent-cursor.js?v=2"></script>
    <script src="/watch-mode.js"></script>
  </body>
</html>
